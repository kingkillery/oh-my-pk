name: Documentation site

on:
  pull_request:
    paths:
      - "docs/**"
      - "infra/docs-site/**"
      - "infra/install-redirect/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "infra/docs-site/**"
      - "infra/install-redirect/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/docs-site
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: Build from repository documentation
        run: bun run build
      - name: Verify pages, links, Markdown, indexes, and existing routes
        run: bun run test
      - name: Validate Worker bundle and asset binding
        run: bun run check:worker
