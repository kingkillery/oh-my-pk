name: Collab Android APK

on:
   pull_request:
      paths:
         - "apps/collab-android/**"
         - "packages/collab-web/**"
         - "packages/wire/**"
         - ".github/workflows/collab-android.yml"
         - "bun.lock"
         - "package.json"
   workflow_dispatch:

concurrency:
   group: collab-android-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   apk:
      name: Debug APK
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
              distribution: temurin
              java-version: "21"
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.14
         - uses: android-actions/setup-android@v4
         - name: Install SDK packages
           run: |
              yes | sdkmanager --licenses >/dev/null || true
              sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
         - name: Build
           run: bash apps/collab-android/scripts/build-apk.sh
         - name: SHA-256
           run: sha256sum apps/collab-android/app/build/outputs/apk/debug/app-debug.apk
         - uses: actions/upload-artifact@v4
           with:
              name: ompk-collab-android-debug
              path: apps/collab-android/app/build/outputs/apk/debug/app-debug.apk
              if-no-files-found: error
