name: Harness2 OMPK pilot

on:
  pull_request:
    paths:
      - "python/harness2-ompk/**"
      - ".github/workflows/harness2-ompk.yml"
  push:
    branches: [main]
    paths:
      - "python/harness2-ompk/**"
      - ".github/workflows/harness2-ompk.yml"

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python/harness2-ompk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned upstream and adapter
        run: python -m pip install -e '.[upstream]'
      - name: Offline adapter and real Harness2 scheduler contract tests
        run: python -m unittest discover -s tests -v
      - name: Default-off preflight
        run: ompk-harness2 check --output ./runs/ci-smoke
