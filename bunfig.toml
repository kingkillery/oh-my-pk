telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
# First-party catalog packages are resolved from this workspace. Exclude their
# newly bumped versions to avoid Bun 1.3.14 stalling during release installs;
# third-party packages remain subject to the three-day age gate.
minimumReleaseAgeExcludes = [
  "@types/bun",
  "bun-types",
  "@pk-nerdsaver-ai/hashline",
  "@pk-nerdsaver-ai/omp-stats",
  "@pk-nerdsaver-ai/pi-agent-core",
  "@pk-nerdsaver-ai/pi-ai",
  "@pk-nerdsaver-ai/pi-catalog",
  "@pk-nerdsaver-ai/pi-coding-agent",
  "@pk-nerdsaver-ai/pi-deep-research",
  "@pk-nerdsaver-ai/pi-mnemopi",
  "@pk-nerdsaver-ai/pi-natives",
  "@pk-nerdsaver-ai/pi-tui",
  "@pk-nerdsaver-ai/pi-utils",
  "@pk-nerdsaver-ai/pi-wire",
  "@pk-nerdsaver-ai/snapcompact",
]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
]

[run]
bun = true
