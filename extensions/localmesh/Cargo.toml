# LocalMesh's own Cargo workspace. It is deliberately not a member of the
# repository root workspace, so core native builds, clippy and Cargo.lock
# never depend on it.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Can Boluk"]
homepage = "https://github.com/kingkillery/oh-my-pk"
repository = "https://github.com/kingkillery/oh-my-pk"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
